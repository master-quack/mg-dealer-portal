<div class="floating-field">
  <input
    class="floating-field__input"
    id="username"
    name="username"
    type="text"
    placeholder=" "
    autocomplete="username"
    required
  />
  <label class="floating-field__label" for="username">Username</label>
</div>

<div class="floating-field">
  <input
    class="floating-field__input"
    id="password"
    name="password"
    type="password"
    placeholder=" "
    autocomplete="current-password"
    required
  />
  <label class="floating-field__label" for="password">Password</label>
</div>
