<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="icon" type="image/svg+xml" href="/mg-logo.svg">
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f5f6f8;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .login-card {
    background: #fff;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    width: 320px;
  }
  .login-card h1 {
    font-size: 20px;
    margin: 0 0 24px 0;
    color: #0b2545;
    text-align: center;
  }
  .floating-field {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }
  .floating-field__input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: 16px/1.4 system-ui, sans-serif;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
  }
  .floating-field__input:focus {
    border-color: #1a73e8;
  }
  .floating-field__label {
    position: absolute;
    left: 16px;
    top: 12px;
    color: #71717a;
    font: 16px/1.4 system-ui, sans-serif;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  .floating-field__input:focus + .floating-field__label,
  .floating-field__input:not(:placeholder-shown) + .floating-field__label {
    top: -10px;
    left: 12px;
    padding: 0 4px;
    font-size: 12px;
    background: #fff;
    color: #1a73e8;
  }
  .login-btn {
    width: 100%;
    padding: 12px;
    background: #0b2545;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
  }
  .login-btn:disabled { background: #999; cursor: not-allowed; }
  #loginError { color: #c0392b; font-size: 13px; margin-top: 12px; text-align: center; min-height: 16px; }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Finance Dashboard Login</h1>
    <form id="loginForm">
      <div class="floating-field">
        <input class="floating-field__input" id="username" name="username" type="text" placeholder=" " autocomplete="username" required>
        <label class="floating-field__label" for="username">Username</label>
      </div>
      <div class="floating-field">
        <input class="floating-field__input" id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
        <label class="floating-field__label" for="password">Password</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Log In</button>
      <div id="loginError"></div>
    </form>
  </div>

<script>
  document.title = 'Login';

  const form = document.getElementById('loginForm');
  const errorDiv = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    errorDiv.textContent = '';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/finance', {
        headers: {
          'Authorization': 'Basic ' + btoa(username + ':' + password)
        }
      });

      if (res.ok) {
        // Store credentials for this tab session so subsequent fetches
        // from finance.html can reuse them (temporary bridge only).
        sessionStorage.setItem('financeAuthHeader', 'Basic ' + btoa(username + ':' + password));
        document.title = 'Dashboard';
        window.location.href = '/finance';
      } else {
        errorDiv.textContent = 'Incorrect username or password.';
        loginBtn.disabled = false;
      }
    } catch (err) {
      errorDiv.textContent = 'Something went wrong. Try again.';
      loginBtn.disabled = false;
    }
  });
</script>
</body>
</html>
